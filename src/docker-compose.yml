version: '3.8'

services:

  API:
    build:
      dockerfile: ./API/WebApp.API/Dockerfile
    container_name: api
    ports:
      - "8080:8080"
      - "8081:8081"
      - "5000:5000"
      - "5058:5058"
    restart: always

  webapp:
    build:
      dockerfile: ./Client/WebApp.Server/Dockerfile
    container_name: webapp
    ports:
      - "8080:8080" # Map host port 8080 to container port 8080   
    restart: always

volumes:
  mongodb_data:
